name: Build & Release

# Tag v* -> build ketiga platform lalu terbitkan Release.
# workflow_dispatch -> build saja, artefaknya bisa diunduh dari halaman run
# (berguna untuk mencoba perubahan build tanpa membuat tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.7'

jobs:
  # Gerbang: jangan sampai rilis dibuat dari kode yang tidak lolos test.
  periksa:
    name: Analyze & test
    runs-on: ubuntu-latest
    outputs:
      versi: ${{ steps.versi.outputs.versi }}
    steps:
      - uses: actions/checkout@v4
      # Nomor versi diambil dari tag, bukan dari pubspec — supaya "Cek
      # pembaruan" di app membandingkan angka yang benar tanpa perlu ingat
      # menaikkan pubspec tiap rilis.
      - id: versi
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "versi=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "versi=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: periksa
    runs-on: ubuntu-latest
    # Konteks `secrets` tidak boleh dipakai di `if` sebuah langkah — GitHub
    # menolak seluruh berkas workflow. Disalin ke env dulu, karena konteks
    # `env` boleh.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Kunci rilis tetap. Tanpa ini tiap runner memakai kunci debug baru dan
      # APK berikutnya tidak bisa memperbarui yang sudah terpasang.
      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,
      #          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Siapkan kunci penandatanganan
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/rilis.jks
          cat > android/key.properties <<EOF
          storeFile=rilis.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Peringatan bila belum ada kunci
        if: env.KEYSTORE_B64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 belum diset. APK ditandatangani kunci debug acak, jadi TIDAK bisa memperbarui versi yang sudah terpasang."
      - run: flutter build apk --release --build-name=${{ needs.periksa.outputs.versi }} --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk TiketAlamat-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: TiketAlamat-android.apk

  linux:
    name: Linux x64
    needs: periksa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependensi build GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.periksa.outputs.versi }} --build-number=${{ github.run_number }}
      - name: Bundel
        run: tar -czf TiketAlamat-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: TiketAlamat-linux-x64.tar.gz

  windows:
    name: Windows x64
    needs: periksa
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        # permission_handler_windows masih memakai <experimental/coroutine>;
        # MSVC baru menolaknya sebagai error. Macro ini yang disarankan pesan
        # errornya sendiri. Hapus begitu plugin itu pindah ke <coroutine> C++20.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release --build-name=${{ needs.periksa.outputs.versi }} --build-number=${{ github.run_number }}
      - name: Bundel
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath TiketAlamat-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: TiketAlamat-windows-x64.zip

  release:
    name: Terbitkan Release
    needs: [android, linux, windows]
    # workflow_dispatch berhenti di artefak; hanya tag yang jadi Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: unduhan
      - uses: softprops/action-gh-release@v2
        with:
          name: Tiket Alamat ${{ github.ref_name }}
          generate_release_notes: true
          files: unduhan/**/*
